{% extends "base.html" %}

{% block title %}Page Not Found (404) - AI Resume Analyzer{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="card p-5 border-0 card-elevated">
      <div class="display-1 text-primary fw-bold mb-3" style="letter-spacing: -0.05em;">404</div>
      <h2 class="fw-bold text-dark mb-2">Analysis or Page Not Found</h2>
      <p class="text-muted mb-4">
        The requested resume analysis ID or page does not exist or may have been deleted.
      </p>
      <div class="d-flex justify-content-center gap-2">
        <a href="{{ url_for('index') }}" class="btn btn-primary fw-semibold shadow-sm">
          <i class="bi bi-house-door me-1"></i> Return Home
        </a>
        <a href="{{ url_for('history') }}" class="btn btn-outline-secondary">
          <i class="bi bi-clock-history me-1"></i> View History
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
